<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eventora Login & Signup</title>
  <link rel="stylesheet" href="style/main.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 🔵 Animated Background -->
  <canvas id="bgCanvas"></canvas>

  <div class="container" id="form-container">
    <div class="card">
      <h2>Welcome to <span>Eventora</span></h2>

      <!-- 🔐 Login Form (Default visible) -->
      <form id="loginForm" class="form">
        <input type="email" id="loginEmail" placeholder="Email" required />
        <input type="password" id="loginPassword" placeholder="Password" required />
        <button type="submit" id="loginBtn">Login</button>
      </form>

      <!-- 📝 Signup Form (Hidden by default) -->
      <form id="signupForm" class="form hidden">
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="signupEmail" placeholder="Email" required />
        <input type="tel" id="phone" placeholder="Phone Number" required />
        <input type="password" id="signupPassword" placeholder="Password" required />
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
        <button type="submit" id="signupBtn">Signup</button>
      </form>

      <!-- 🔄 Switcher -->
      <div class="toggle">
        <button id="switchForm">Switch to Signup/Login</button>
      </div>
    </div>
  </div>

  <!-- 🔌 Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.3.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.3.0/firebase-auth-compat.js"></script>

  <!-- 🧠 Firebase Config -->
  <script type="module" src="firebase/config.js"></script>

  <!-- ✨ 3D Background -->
  <script type="module" src="js/threebg.js"></script>

  <!-- 🎯 3D Tilt Animations -->
  <script src="js/tilt.js"></script>

  <!-- 🧪 Input Validation -->
  <script src="js/validate.js"></script>

  <!-- 🚀 App Logic (Login/Signup/Redirect) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
