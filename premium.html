<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Eventora Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
 <!-- In home/index.html head -->
<!-- CSS -->
<link rel="stylesheet" href="./assets/css/mains.css">

<link rel="stylesheet" href="../lib/aos.css">
<link rel="stylesheet" href="../lib/all.min.css"> <!-- Font Awesome -->

<!-- JS Libraries -->
<script src="../lib/aos.min.js"></script>
<script src="../lib/gsap.min.js"></script>
<script src="../lib/ScrollTrigger.min.js"></script>
<script src="../lib/Draggable.min.js"></script>
<script src="../lib/Flip.min.js"></script>

<!-- THREE.js as Module (inside your JS) -->
<script type="module" src="../js/canvasBg.js"></script>

<!-- JS -->
<script src="../js/themeToggle.js"></script>
<script src="../js/home.js"></script>

<script type="module">
  import * as THREE from '../lib/three.module.min.js';
  // use it here or in canvasBg.js etc.
</script>
>
</head>
<body>

  <!-- Terms Popup -->
  <div id="cookieBox">
    <p>By using Eventora, you accept our Terms & Cookies.</p>
    <button id="acceptCookies">Accept</button>
  </div>

  <!-- HEADER -->
  <header class="main-header">
    <div class="brand">
      <img src="../assets/images/logo.png" alt="Logo" />
      <span>Eventora</span>
    </div>

    <div class="search-container">
      <input type="text" placeholder="Search events...">
    </div>

    <div class="user-section">
      <div id="userHex" class="hex"></div>
      <button id="logoutBtn" class="logout hidden">Logout</button>
      <button id="premiumBtn" class="premium">Premium</button>
    </div>
  </header>

  <!-- Premium Plans -->
  <div id="premiumPopup" class="hidden">
    <div class="plan">Plan A - ₹99/month <button class="buy">Buy</button></div>
    <div class="plan">Plan B - ₹199/month <button class="buy">Buy</button></div>
    <div class="plan">Plan C - ₹299/month <button class="buy">Buy</button></div>
  </div>

  <!-- WELCOME AREA -->
  <section class="hero-section">
    <div class="welcome" data-aos="fade-up">
      <h1>Welcome to Eventora</h1>
      <p>Your gateway to next-gen events</p>
    </div>
    <div class="theme-toggle">🌗</div>
  </section>

  <!-- Add more sections later... -->

  <!-- FOOTER -->
  <footer>
    <div>© 2025 Eventora. All rights reserved.</div>
  </footer>

  <script src="home.js" type="module"></script>
</body>
</html>
